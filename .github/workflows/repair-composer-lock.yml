name: Repair Composer lock

on:
  push:
    branches:
      - build-001-biolync-rebrand-baseline
    paths:
      - .github/workflows/repair-composer-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment branch
        uses: actions/checkout@v4

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          coverage: none

      - name: Generate a clean lock file from declared dependencies
        run: |
          mv composer.lock composer.lock.stale
          composer update --with-all-dependencies --no-interaction --no-scripts --no-install

      - name: Confirm flagged stale packages are absent
        run: |
          if grep -Eq '"name": "laravel-lang/(attributes|http-statuses|lang)"' composer.lock; then
            echo "Flagged packages remain in the regenerated lock file"
            exit 1
          fi

      - name: Validate Composer files
        run: composer validate --no-check-publish

      - name: Commit repaired lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate Composer lock for Hostinger deployment"
            git push
          fi

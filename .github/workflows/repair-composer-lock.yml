name: Repair Composer lock

on:
  push:
    branches:
      - build-001-biolync-rebrand-baseline
    paths:
      - .github/workflows/repair-composer-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment branch
        uses: actions/checkout@v4

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          coverage: none

      - name: Refresh Symfony YAML lock data
        run: composer update symfony/yaml --with-all-dependencies --no-interaction --no-scripts

      - name: Validate Composer files
        run: composer validate --no-check-publish

      - name: Commit repaired lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if ! git diff --cached --quiet; then
            git commit -m "Fix Composer lock for Hostinger deployment"
            git push
          fi
